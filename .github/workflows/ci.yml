name: Code quality and release

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Syntax, code style and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - run: npm ci
      - run: npm test

  recipes:
    name: Apply recipe compositions
    needs: lint
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          ini-values: memory_limit=512M
          tools: composer:2.10.3
          coverage: none
      - name: Install all recipe dependencies
        run: |
          site="$RUNNER_TEMP/sous-recipes"
          composer create-project drupal/recommended-project:^11.4 "$site" --no-interaction
          cp -R patches "$site/patches"
          versions=$(jq -s 'map({key:.name,value:"2.0.0"})|from_entries' packages/*/composer.json)
          jq --arg path "$GITHUB_WORKSPACE/packages/*" --argjson versions "$versions" '
            .repositories += [
              {type:"path",url:$path,options:{symlink:false,versions:$versions}},
              {type:"git",url:"https://github.com/fourkitchens/viewsreference_sift.git",only:["fourkitchens/viewsreference_sift"]}
            ] |
            .["minimum-stability"] = "beta" |
            .["prefer-stable"] = true |
            .require."cweagans/composer-patches" = "^2.0" |
            .config."allow-plugins"."cweagans/composer-patches" = true |
            .extra["composer-patches"]["patches-file"] = "patches/patches.json"
          ' "$site/composer.json" > "$site/composer.tmp"
          mv "$site/composer.tmp" "$site/composer.json"
          mapfile -t recipes < <(jq -r 'select(.type == "drupal-recipe") | .name' packages/*/composer.json)
          cd "$site"
          composer require drush/drush --no-interaction
          composer require "${recipes[@]}" --no-interaction
          locked_versions=$(jq -r '
            .packages[] |
            select(.name == "fourkitchens/viewsreference_sift" or .name == "drupal/viewsreference") |
            "- `\(.name)` `\(.version)`"
          ' composer.lock)
          printf '### Locked Views Reference versions\n\n%s\n' "$locked_versions" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply each composition to a fresh SQLite site
        run: |
          cd "$RUNNER_TEMP/sous-recipes"
          for composition in admin content-types core-layout-builder paragraphs; do
            echo "::group::$composition"
            chmod -R u+w web/sites/default
            rm -f web/sites/default/settings.php site.sqlite
            vendor/bin/drush site:install minimal --db-url="sqlite://localhost/$PWD/site.sqlite?module=sqlite" --yes
            for recipe in sous-admin sous-emulsify sous-media sous-formats sous-dashboard sous-config-split; do
              vendor/bin/drush recipe "$PWD/recipes/$recipe" --yes
            done
            if [[ "$composition" != admin ]]; then vendor/bin/drush recipe "$PWD/recipes/sous-$composition" --yes; fi
            for recipe in sous-events sous-news-post sous-profile; do
              vendor/bin/drush recipe "$PWD/recipes/$recipe" --yes
              if [[ "$composition" == admin ]]; then
                vendor/bin/drush recipe "$PWD/recipes/$recipe" --yes
              fi
              if [[ "$recipe" != sous-profile && ( "$composition" == paragraphs || "$composition" == core-layout-builder ) ]]; then
                vendor/bin/drush recipe "$PWD/recipes/$recipe/recipes/$composition" --yes
              fi
            done
            vendor/bin/drush recipe "$PWD/recipes/sous-content-list" --yes
            if [[ "$composition" == paragraphs || "$composition" == core-layout-builder ]]; then
              vendor/bin/drush recipe "$PWD/recipes/sous-content-list/recipes/$composition" --yes
              vendor/bin/drush recipe "$PWD/recipes/sous-gallery" --yes
              vendor/bin/drush recipe "$PWD/recipes/sous-gallery/recipes/$composition" --yes
            fi
            vendor/bin/drush recipe "$PWD/recipes/sous-seo" --yes
            vendor/bin/drush recipe "$PWD/recipes/sous-alerts" --yes
            if [[ "$composition" == admin ]]; then
              vendor/bin/drush recipe "$PWD/recipes/sous-alerts" --yes
            fi
            vendor/bin/drush recipe "$PWD/recipes/sous-search" --yes
            vendor/bin/drush status --field=bootstrap | grep -Fx Successful
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-composition.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-events.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-news.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-profile.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-content-list.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-gallery.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-workflow.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-authoring.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-dashboard.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-seo.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-alerts.php"
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-search.php"
            echo '::endgroup::'
          done
          bash "$GITHUB_WORKSPACE/devops/tests/verify-environments.sh"

  release:
    needs: [lint, recipes]
    if: github.repository == 'fourkitchens/sous-drupal-packages' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.index.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Release the package collection
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Rebuild Composer index from published releases
        id: index
        run: node tools/release.mjs index
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy-index:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Deploy Composer index
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed Composer index
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: node tools/verify-index.mjs "${PAGE_URL%/}/packages.json" "$RELEASE_VERSION"
