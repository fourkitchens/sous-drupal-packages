name: Code quality and release

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Syntax, code style and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - run: npm ci
      - run: npm test

  recipes:
    name: Apply recipe compositions
    needs: lint
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          ini-values: memory_limit=512M
          tools: composer:2.10.3
          coverage: none
      - name: Install all recipe dependencies
        run: |
          site="$RUNNER_TEMP/sous-recipes"
          composer create-project drupal/recommended-project:^11.4 "$site" --no-interaction
          mkdir -p "$site/patches"
          cp packages/sous-paragraphs/assets/patches/layout-paragraphs-component-list-3487314.patch "$site/patches/"
          cp packages/sous-paragraph-types/assets/patches/style-selector-drupal11-compatibility.patch "$site/patches/"
          cp packages/sous-paragraph-types/assets/patches/tablefield-*.patch "$site/patches/"
          versions=$(jq -s 'map({key:.name,value:"2.0.0"})|from_entries' packages/*/composer.json)
          jq --arg path "$GITHUB_WORKSPACE/packages/*" --argjson versions "$versions" \
            --slurpfile tablefield packages/sous-paragraph-types/assets/patches/tablefield.json '
            .repositories += [
              {type:"path",url:$path,options:{symlink:false,versions:$versions}},
              {type:"package",package:{name:"dropzone/dropzone",version:"6.3.5",type:"drupal-library",
                extra:{"installer-name":"dropzone"},
                dist:{url:"https://github.com/enyo/dropzone/releases/download/dropzone%406.3.5/dist.zip",type:"zip"}}}
            ] |
            .require."cweagans/composer-patches" = "^2.0" |
            .config."allow-plugins"."cweagans/composer-patches" = true |
            .extra.patches = {"drupal/layout_paragraphs": [{
              description: "Improve Layout Paragraphs component selection",
              url: "patches/layout-paragraphs-component-list-3487314.patch",
              sha256: "1f41f7ef7024f9c4c88b98f8250539581357c62f2306b5b89b3368ac19d7ffaa",
              depth: 1,
              extra: {"issue-tracker-url": "https://www.drupal.org/project/layout_paragraphs/issues/3487314"}
            }], "drupal/style_selector": [{
              description: "Custom Drupal 11 field-default schema and library discovery compatibility",
              url: "patches/style-selector-drupal11-compatibility.patch",
              depth: 1
            }]} + $tablefield[0].patches
          ' "$site/composer.json" > "$site/composer.tmp"
          mv "$site/composer.tmp" "$site/composer.json"
          mapfile -t recipes < <(jq -r '.name' packages/*/composer.json)
          cd "$site"
          composer require 'drupal/login_destination:^2.0.0-beta10@beta' drush/drush --no-interaction
          composer require "${recipes[@]}" --no-interaction
      - name: Apply each composition to a fresh SQLite site
        run: |
          cd "$RUNNER_TEMP/sous-recipes"
          for composition in admin content-types core-layout-builder paragraphs config-split; do
            echo "::group::$composition"
            chmod -R u+w web/sites/default
            rm -f web/sites/default/settings.php site.sqlite
            vendor/bin/drush site:install minimal --db-url="sqlite://localhost/$PWD/site.sqlite?module=sqlite" --yes
            for recipe in sous-admin sous-emulsify; do
              vendor/bin/drush recipe "$PWD/recipes/$recipe" --yes
            done
            if [[ "$composition" != admin ]]; then vendor/bin/drush recipe "$PWD/recipes/sous-$composition" --yes; fi
            vendor/bin/drush status --field=bootstrap | grep -Fx Successful
            COMPOSITION="$composition" vendor/bin/drush php:script "$GITHUB_WORKSPACE/devops/tests/verify-composition.php"
            echo '::endgroup::'
          done

  release:
    needs: [lint, recipes]
    if: github.repository == 'fourkitchens/sous-drupal-packages' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Release the package collection
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Rebuild Composer index from published releases
        run: node tools/release.mjs index
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy-index:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Composer index
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
