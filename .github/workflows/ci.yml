name: Package validation

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run build -- --version 2.0.0 --reference "$GITHUB_SHA" --output build --dist-base-url https://github.com/fourkitchens/sous-drupal-packages/releases/download/2.0.0/

  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        composition: [default, core-layout-builder, paragraphs, admin-only]
        config-split: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:2.10.3
      - name: Test selected composition and optional splits
        run: |
          args=(--case "$SOUS_COMPOSITION")
          if [[ "$SOUS_CONFIG_SPLIT" == 'true' ]]; then args+=(--config-split); fi
          npm run test:consumer -- "${args[@]}"
        env:
          SOUS_COMPOSITION: ${{ matrix.composition }}
          SOUS_CONFIG_SPLIT: ${{ matrix.config-split }}
