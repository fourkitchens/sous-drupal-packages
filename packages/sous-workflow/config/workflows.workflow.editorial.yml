langcode: en
status: true
dependencies:
  module:
    - content_moderation
id: editorial
label: Editorial
type: content_moderation
type_settings:
  states:
    archived:
      label: Archived
      weight: 2
      published: false
      default_revision: true
    draft:
      label: Draft
      weight: 0
      published: false
      default_revision: false
    published:
      label: Published
      weight: 1
      published: true
      default_revision: true
  transitions:
    archive_unpublish:
      label: 'Archive (Unpublish)'
      from:
        - archived
        - draft
        - published
      to: archived
      weight: 2
    create_new_draft:
      label: 'Create New Draft'
      from:
        - archived
        - draft
        - published
      to: draft
      weight: 0
    publish:
      label: Publish
      from:
        - archived
        - draft
        - published
      to: published
      weight: 1
  entity_types: {}
  default_moderation_state: draft
