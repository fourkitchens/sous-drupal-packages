name: 'Sous Profile'
description: 'Adds profiles with automatic names, images, biographies and a searchable teaser list.'
type: Site
recipes:
  - sous-workflow
  - sous-media
  - sous-formats
install:
  - node
  - menu_ui
  - media
  - media_library
  - entity_browser
  - field_group
  - metatag
  - text
  - path
  - pathauto
  - token
  - auto_entitylabel
  - views
config:
  import:
    metatag: '*'
    node:
      - core.entity_view_mode.node.teaser
  strict:
    - auto_entitylabel.settings.node.profile
    - core.entity_form_display.node.profile.default
    - core.entity_view_display.node.profile.default
    - core.entity_view_display.node.profile.teaser
    - entity_browser.browser.profile_content_browser
    - field.field.node.profile.field_description
    - field.field.node.profile.field_first_name
    - field.field.node.profile.field_image
    - field.field.node.profile.field_last_name
    - field.field.node.profile.field_metadata
    - field.field.node.profile.field_teaser_image
    - field.field.node.profile.field_teaser_text
    - field.storage.node.field_description
    - field.storage.node.field_first_name
    - field.storage.node.field_image
    - field.storage.node.field_last_name
    - field.storage.node.field_metadata
    - field.storage.node.field_teaser_image
    - field.storage.node.field_teaser_text
    - node.type.profile
    - pathauto.pattern.profile
    - views.view.profiles
  actions:
    '?user.role.site_editor':
      grantPermissions:
        - 'create url aliases'
        - 'access profile_content_browser entity browser pages'
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'edit any %bundle content'
        - 'delete any %bundle content'
        - 'view %bundle revisions'
        - 'revert %bundle revisions'
        - 'delete %bundle revisions'
    workflows.workflow.editorial:
      addNodeTypes:
        - profile
