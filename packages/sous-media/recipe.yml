name: 'Sous Media'
description: 'Provides image, file and video media with focal-point cropping and native uploads.'
type: 'Site'
install:
  # Core modules
  - file
  - image
  - link
  - media
  - media_library
  - responsive_image
  - taxonomy
  - views
  # Contrib modules
  - field_group
  - focal_point
  - media_library_edit
  - scheduler
  # Supplies the same breakpoint widths as the generated theme.
  - emulsify
config:
  # Protect bundle/field/display and provider defaults. Native management Views
  # may already belong to Admin or the project; import missing Views only.
  strict:
    - core.entity_form_display.media.file.default
    - core.entity_form_display.media.image.default
    - core.entity_form_display.media.video.default
    - core.entity_form_display.media.video_file.default
    - core.entity_form_display.media.video_file.media_library
    - core.entity_form_mode.media.media_library
    - core.entity_view_display.media.file.default
    - core.entity_view_display.media.file.media_library
    - core.entity_view_display.media.file.preview
    - core.entity_view_display.media.image.content_teaser_landscape
    - core.entity_view_display.media.image.content_teaser_portrait
    - core.entity_view_display.media.image.content_teaser_square
    - core.entity_view_display.media.image.default
    - core.entity_view_display.media.image.media_library
    - core.entity_view_display.media.image.preview
    - core.entity_view_display.media.video.default
    - core.entity_view_display.media.video.media_library
    - core.entity_view_display.media.video.preview
    - core.entity_view_display.media.video_file.default
    - core.entity_view_display.media.video_file.media_library
    - core.entity_view_display.media.video_file.preview
    - core.entity_view_mode.file.token
    - core.entity_view_mode.media.content_teaser_landscape
    - core.entity_view_mode.media.content_teaser_portrait
    - core.entity_view_mode.media.content_teaser_square
    - core.entity_view_mode.media.full
    - core.entity_view_mode.media.media_library
    - core.entity_view_mode.media.preview
    - core.entity_view_mode.media.token
    - crop.type.focal_point
    - field.field.media.file.field_description
    - field.field.media.file.field_media_file
    - field.field.media.file.field_tags
    - field.field.media.image.field_caption
    - field.field.media.image.field_copyright
    - field.field.media.image.field_description
    - field.field.media.image.field_media_image
    - field.field.media.image.field_tags
    - field.field.media.video.field_caption
    - field.field.media.video.field_copyright
    - field.field.media.video.field_description
    - field.field.media.video.field_media_oembed_video
    - field.field.media.video.field_tags
    - field.field.media.video.field_transcript
    - field.field.media.video_file.field_caption
    - field.field.media.video_file.field_copyright
    - field.field.media.video_file.field_description
    - field.field.media.video_file.field_media_file
    - field.field.media.video_file.field_tags
    - field.field.media.video_file.field_transcript
    - field.storage.media.field_caption
    - field.storage.media.field_copyright
    - field.storage.media.field_description
    - field.storage.media.field_media_file
    - field.storage.media.field_media_image
    - field.storage.media.field_media_oembed_video
    - field.storage.media.field_tags
    - field.storage.media.field_transcript
    - focal_point.settings
    - image.settings
    - image.style.content_teaser_landscape_medium
    - image.style.content_teaser_landscape_small
    - image.style.content_teaser_landscape_xsmall
    - image.style.content_teaser_portrait_medium
    - image.style.content_teaser_portrait_small
    - image.style.content_teaser_portrait_xsmall
    - image.style.content_teaser_square_medium
    - image.style.content_teaser_square_small
    - image.style.content_teaser_square_xsmall
    - image.style.large
    - image.style.media_library
    - image.style.medium
    - image.style.thumbnail
    - image.style.wide
    - media.settings
    - media.type.file
    - media.type.image
    - media.type.video
    - media.type.video_file
    - media_library.settings
    - responsive_image.styles.content_teaser_landscape
    - responsive_image.styles.content_teaser_portrait
    - responsive_image.styles.content_teaser_square
    - system.action.media_delete_action
    - system.action.media_publish_action
    - system.action.media_save_action
    - system.action.media_unpublish_action
    - taxonomy.vocabulary.media_tags
  import:
    # Core.
    image: '*'
    media: '*'
    media_library: '*'
    # Contrib.
    focal_point: '*'
  actions:
    '?user.role.site_editor':
      grantPermissions:
        - 'schedule publishing of media'
        - 'view scheduled media'
        - 'create terms in media_tags'
        - 'edit terms in media_tags'
        - 'delete terms in media_tags'
      grantPermissionsForEachMediaType:
        - 'create %bundle media'
        - 'edit any %bundle media'
        - 'delete any %bundle media'
        - 'view any %bundle media revisions'
        - 'revert any %bundle media revisions'
        - 'delete any %bundle media revisions'
