name: 'Sous Content Base'
description: 'Provides shared Page and Frontpage fields, authoring tabs, teasers and URL aliases.'
type: Site
recipes:
  - sous-workflow
  - sous-formats
  - sous-media
install:
  - media
  - media_library
  - node
  - text
  - user
  - menu_ui
  - path
  - pathauto
  - field_group
  - metatag
  - publication_date
  - tagify
config:
  import:
    metatag: '*'
  actions:
    workflows.workflow.editorial:
      addNodeTypes:
        - page
        - frontpage
    core.entity_form_display.node.page.default:
      setComponent:
        name: path
        options:
          type: path
          weight: 30
          region: content
          settings: {}
          third_party_settings: {}
