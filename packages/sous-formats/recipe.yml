name: 'Sous Formats'
description: 'A recipe that provides text and editor formats and shared Linkit defaults.'
type: 'Site'
install:
  - ckeditor5
  - editor
  - filter
  - linkit
  - media
  - node
config:
  # Validate editor and format defaults while preserving project-owned
  # Linkit profiles.
  strict:
    - editor.editor.basic_html
    - editor.editor.full_html
    - editor.editor.limited_html
    - editor.editor.restricted_html
    - filter.format.basic_html
    - filter.format.full_html
    - filter.format.limited_html
    - filter.format.restricted_html
  import:
    filter:
      - filter.format.plain_text
    media:
      - core.entity_view_mode.media.full
