name: 'Sous Core Layout Builder'
description: 'Enables Layout Builder for Page and Frontpage with text, media, accordion, tab, quote, embed and table blocks.'
type: Site
recipes:
  - sous-content-types
install:
  - block
  - block_content
  - entity_reference_revisions
  - contextual
  - field_group
  - layout_discovery
  - layout_builder
  - media_library
  - media_library_edit
  - options
  - style_selector
  - text
  - inline_entity_form
  - tablefield
config:
  actions:
    core.entity_view_display.node.page.default:
      enableLayoutBuilder: {}
      allowLayoutOverrides: true
    core.entity_view_display.node.frontpage.default:
      enableLayoutBuilder: {}
      allowLayoutOverrides: true
    '?user.role.site_editor':
      grantPermissions:
        - 'administer block content'
        - 'create and edit custom blocks'
        - 'configure editable page node layout overrides'
        - 'configure editable frontpage node layout overrides'
  import:
    style_selector: '*'
    tablefield: '*'
  strict:
    - block_content.type.accordion
    - block_content.type.accordion_item
    - block_content.type.embed
    - block_content.type.image
    - block_content.type.quote
    - block_content.type.table
    - block_content.type.tabs
    - block_content.type.tabs_item
    - block_content.type.text
    - block_content.type.text_with_media
    - block_content.type.video
