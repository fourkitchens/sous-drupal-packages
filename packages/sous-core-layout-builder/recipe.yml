name: 'Sous Core Layout Builder'
description: 'Page and Frontpage layouts with Text, Text with Media, Video and Image inline blocks.'
type: Site
recipes:
  - sous-content-types
install:
  - block
  - block_content
  - contextual
  - field_ui
  - field_group
  - layout_discovery
  - layout_builder
  - media_library
  - media_library_edit
  - options
  - style_selector
  - text
config:
  actions:
    core.entity_view_display.node.page.default:
      enableLayoutBuilder: {}
      allowLayoutOverrides: true
    core.entity_view_display.node.frontpage.default:
      enableLayoutBuilder: {}
      allowLayoutOverrides: true
  import:
    style_selector: '*'
  strict:
    - block_content.type.image
    - block_content.type.text
    - block_content.type.text_with_media
    - block_content.type.video
    - core.entity_form_display.block_content.image.default
    - core.entity_form_display.block_content.text.default
    - core.entity_form_display.block_content.text_with_media.default
    - core.entity_form_display.block_content.video.default
    - core.entity_view_display.block_content.image.default
    - core.entity_view_display.block_content.text.default
    - core.entity_view_display.block_content.text_with_media.default
    - core.entity_view_display.block_content.video.default
    - field.field.block_content.image.field_heading
    - field.field.block_content.image.field_image
    - field.field.block_content.image.field_show_captions
    - field.field.block_content.image.field_style_layout_width
    - field.field.block_content.image.field_text
    - field.field.block_content.text.field_heading
    - field.field.block_content.text.field_text
    - field.field.block_content.text_with_media.field_component_focus
    - field.field.block_content.text_with_media.field_heading
    - field.field.block_content.text_with_media.field_media
    - field.field.block_content.text_with_media.field_show_captions
    - field.field.block_content.text_with_media.field_style_media_alignment
    - field.field.block_content.text_with_media.field_text
    - field.field.block_content.text_with_media.field_text_with_media_display
    - field.field.block_content.video.field_heading
    - field.field.block_content.video.field_show_captions
    - field.field.block_content.video.field_style_layout_width
    - field.field.block_content.video.field_text
    - field.field.block_content.video.field_video
    - field.storage.block_content.field_component_focus
    - field.storage.block_content.field_heading
    - field.storage.block_content.field_image
    - field.storage.block_content.field_media
    - field.storage.block_content.field_show_captions
    - field.storage.block_content.field_style_layout_width
    - field.storage.block_content.field_style_media_alignment
    - field.storage.block_content.field_text
    - field.storage.block_content.field_text_with_media_display
    - field.storage.block_content.field_video
