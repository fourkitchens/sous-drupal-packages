name: 'Sous Admin'
description: 'Provides Gin administration, editorial tools, navigation, and roles for Superusers and Site Admins.'
type: 'Site'
recipes:
  - sous-workflow
  # Install core recipes
  - core/recipes/core_recommended_performance
install:
  # Install core dependencies.
  - automated_cron
  - block_content
  - media
  - media_library
  - node
  - taxonomy
  - views
  # Install Autosave Form.
  - autosave_form
  # Install Config log.
  - config_log
  - editoria11y
  # Install Gin theme and base modules that extend it.
  - gin
  - gin_login
  # Install Entity Usuage
  - entity_usage
  # Install Field Group and dependencies
  - field_group
  # Install Login History
  - login_history
  # Install Media Library Edit
  - media_library_edit
  # Install Menu Admin per Menu and Menu Block.
  - menu_admin_per_menu
  - menu_block
  - menu_link_content
  # Install Navigation
  - navigation
  - navigation_extra_tools
  # Make the non-breaking-space filter available without adding content formats.
  - no_nbsp
  # Install Publication Date
  - publication_date
  - administerusersbyrole
  - role_delegation
  # Install Save and Edit
  - save_edit
  # Install Tagify
  - tagify
  # Install Trash.
  - trash
  - twig_tweak
  # Install Views AJAX History
  - views_ajax_history
  # Install Views Bulk Operations
  - views_bulk_operations
config:
  # Preserve existing roles while validating the Gin baseline.
  strict:
    - gin.settings
    - block.block.gin_breadcrumbs
    - block.block.gin_content
    - block.block.gin_local_actions
    - block.block.gin_messages
    - block.block.gin_page_title
    - block.block.gin_primary_local_tasks
    - block.block.gin_secondary_local_tasks
  import:
    administerusersbyrole:
      - views.view.administerusersbyrole_people
    gin:
      - gin.settings
      - block.block.gin_breadcrumbs
      - block.block.gin_content
      - block.block.gin_local_actions
      - block.block.gin_messages
      - block.block.gin_page_title
      - block.block.gin_primary_local_tasks
      - block.block.gin_secondary_local_tasks
    navigation:
      - system.menu.content
    # Import native management Views without overwriting project-owned variants.
    block_content:
      - views.view.block_content
    node:
      - views.view.content
      - views.view.glossary
    file:
      - views.view.files
    media:
      - views.view.media
    media_library:
      - views.view.media_library
    taxonomy:
      - views.view.taxonomy_term
    user:
      - views.view.who_s_new
      - views.view.who_s_online
    login_history:
      - views.view.login_history
  actions:
    # Blocks and Files stay available as tabs on the Content page.
    core.menu.static_menu_link_overrides:
      simpleConfigUpdate:
        definitions.navigation__blocks:
          menu_name: content
          parent: ''
          weight: 0
          expanded: false
          enabled: false
        definitions.navigation__files:
          menu_name: content
          parent: ''
          weight: 0
          expanded: false
          enabled: false
    user.role.site_editor:
      grantPermissions:
        - 'access administration pages'
        - 'access block library'
        - 'access content'
        - 'access content overview'
        - 'access files overview'
        - 'access media overview'
        - 'access navigation'
        - 'access taxonomy overview'
        - 'access trash'
        - 'access user profiles'
        - 'access users overview'
        - 'administer footer menu items'
        - 'administer main menu items'
        - 'assign site_editor role'
        - 'cancel users by role'
        - 'create users'
        - 'delete any file'
        - 'edit users by role'
        - 'mark as hidden in editoria11y'
        - 'schedule publishing of nodes'
        - 'use editorial transition archive_unpublish'
        - 'use editorial transition create_new_draft'
        - 'use editorial transition publish'
        - 'view any unpublished content'
        - 'view editoria11y checker'
        - 'view latest version'
        - 'view media'
        - 'view own unpublished media'
        - 'view scheduled content'
        - 'view the administration theme'
        - 'view unpublished block content'
    # Disable legacy Gin blocks only when that Gin version provides them.
    '?block.block.gin_admin':
      setProperties:
        status: false
    '?block.block.gin_branding':
      setProperties:
        status: false
    block.block.gin_local_actions:
      setProperties:
        region: content
        weight: -10
    '?block.block.gin_local_tasks':
      setProperties:
        status: false
    block.block.gin_page_title:
      setProperties:
        region: header
        weight: -10
    block.block.gin_primary_local_tasks:
      setProperties:
        region: header
        weight: -5
    '?block.block.gin_tools':
      setProperties:
        status: false
    # Update entity_usage
    entity_usage.settings:
      simpleConfigUpdate:
        track_enabled_base_fields: true
        local_task_enabled_entity_types:
          - media
    # Update gin settings
    gin.settings:
      simpleConfigUpdate:
        preset_accent_color: 'green'
        classic_toolbar: 'horizontal'
    # Update the node settings to use the admin theme.
    node.settings:
      simpleConfigUpdate:
        use_admin_theme: true
    # Update save_edit settings
    save_edit.settings:
      simpleConfigUpdate:
        button_value: ''
        button_weight: '-10'
    # Update the admin theme to Gin in Theme settings.
    system.theme:
      simpleConfigUpdate:
        admin: gin
    # Role saves rewrite these settings, so set Safe after all role grants.
    administerusersbyrole.settings:
      simpleConfigUpdate:
        roles.site_editor: safe
