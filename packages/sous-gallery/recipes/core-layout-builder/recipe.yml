name: 'Sous Gallery with Layout Builder'
description: 'Adds a Gallery component to Layout Builder.'
type: Site
install:
  - block_content
  - field_group
  - media_library
  - media_library_edit
  - options
  - style_selector
  - text
config:
  strict:
    - block_content.type.gallery
    - core.entity_form_display.block_content.gallery.default
    - core.entity_view_display.block_content.gallery.default
    - field.field.block_content.gallery.field_heading
    - field.field.block_content.gallery.field_media_multiple
    - field.field.block_content.gallery.field_style_layout_width
    - field.field.block_content.gallery.field_text
    - field.storage.block_content.field_media_multiple
  actions:
    field.field.block_content.accordion_item.field_content: &accept_gallery
      setProperties:
        settings.handler_settings.target_bundles.gallery: gallery
    field.field.block_content.tabs_item.field_content: *accept_gallery
