name: 'Sous Paragraphs'
description: 'Optional Paragraphs composition for Sous Page and Frontpage content types.'
type: 'Site'
recipes:
  - sous-content-types
  - sous-paragraph-types
install:
  - paragraphs_features
config:
  import:
    paragraphs_ee: '*'
    paragraphs_features: '*'
  actions:
    # Update page form display settings
    core.entity_form_display.node.page.default:
      setComponent:
        name: field_content
        options:
          type: paragraphs
          weight: 123
          region: content
          settings:
            title: Component
            title_plural: Components
            edit_mode: open
            closed_mode: summary
            autocollapse: none
            closed_mode_threshold: 0
            add_mode: dropdown
            form_display_mode: default
            default_paragraph_type: _none
            features:
              add_above: add_above
              collapse_edit_all: collapse_edit_all
              convert: '0'
              duplicate: '0'
          third_party_settings:
            paragraphs_features:
              add_in_between: false
              add_in_between_link_count: 3
              delete_confirmation: true
              show_drag_and_drop: true
              show_collapse_all: true
            paragraphs_ee:
              paragraphs_ee:
                dialog_off_canvas: false
                dialog_style: tiles
      # Keep Body visible while retaining the base recipe's other authoring tabs.
      simpleConfigUpdate:
        third_party_settings.field_group.group_content.children:
          - body
          - field_content
    # Update page view display settings
    core.entity_view_display.node.page.default:
      setComponent:
        name: field_content
        options:
          type: entity_reference_revisions_entity_view
          label: hidden
          settings:
            view_mode: default
            link: ''
          third_party_settings: {}
          weight: 10
          region: content
    core.entity_form_display.node.frontpage.default:
      setComponent:
        name: field_content
        options:
          type: paragraphs
          weight: 122
          region: content
          settings:
            title: Component
            title_plural: Components
            edit_mode: open
            closed_mode: summary
            autocollapse: none
            closed_mode_threshold: 0
            add_mode: dropdown
            form_display_mode: default
            default_paragraph_type: _none
            features:
              add_above: add_above
              collapse_edit_all: collapse_edit_all
          third_party_settings: {}
      simpleConfigUpdate:
        third_party_settings.field_group.group_content.children:
          - body
          - field_content
    core.entity_view_display.node.frontpage.default:
      setComponent:
        name: field_content
        options:
          type: entity_reference_revisions_entity_view
          label: hidden
          weight: 10
          region: content
          settings:
            view_mode: default
            link: ''
          third_party_settings: {}
