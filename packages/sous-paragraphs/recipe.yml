name: 'Sous Paragraphs'
description: 'Page and Frontpage authoring with Layout Paragraphs and reusable components.'
type: Site
recipes:
  - sous-content-base
  - sous-paragraph-types
install:
  - layout_paragraphs
  - layout_paragraphs_library
  - layout_paragraphs_permissions
  - layout_paragraphs_limit
  - paragraphs_features
  - paragraphs_type_permissions
config:
  import:
    paragraphs_ee: '*'
    paragraphs_features: '*'
  actions:
    core.entity_form_display.node.page.default:
      setComponent:
        name: field_content
        options:
          type: layout_paragraphs
          weight: 7
          region: content
          settings:
            view_mode: default
            preview_view_mode: default
            form_display_mode: default
            nesting_depth: 0
            require_layouts: 0
            empty_message: ''
            widget_settings_source: default
            widget_settings:
              show_search: true
              show_icons: true
              show_description: false
              display_mode: list
          third_party_settings: {}
      setProperties:
        third_party_settings.field_group.group_content.children:
          - field_content
    core.entity_view_display.node.page.default:
      setComponent:
        name: field_content
        options:
          type: layout_paragraphs
          label: hidden
          settings:
            view_mode: default
            link: ''
          third_party_settings: {}
          weight: 1
          region: content
    core.entity_form_display.node.frontpage.default:
      setComponent:
        name: field_content
        options:
          type: layout_paragraphs
          weight: 7
          region: content
          settings:
            view_mode: default
            preview_view_mode: default
            form_display_mode: default
            nesting_depth: 0
            require_layouts: 0
            empty_message: ''
            widget_settings_source: default
            widget_settings:
              show_search: true
              show_icons: true
              show_description: false
              display_mode: list
          third_party_settings: {}
      setProperties:
        third_party_settings.field_group.group_content.children:
          - field_content
    core.entity_view_display.node.frontpage.default:
      setComponent:
        name: field_content
        options:
          type: layout_paragraphs
          label: hidden
          settings:
            view_mode: default
            link: ''
          third_party_settings: {}
          weight: 1
          region: content
    user.role.anonymous:
      grantPermissions:
        - 'view paragraph content text'
        - 'view paragraph content text_with_media'
        - 'view paragraph content video'
        - 'view paragraph content image'
        - 'view paragraph content from_library'
    user.role.authenticated:
      grantPermissions:
        - 'view paragraph content text'
        - 'view paragraph content text_with_media'
        - 'view paragraph content video'
        - 'view paragraph content image'
        - 'view paragraph content from_library'
