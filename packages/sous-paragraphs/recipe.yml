name: 'Sous Paragraphs'
description: 'Adds Layout Paragraphs authoring to Page and Frontpage with reusable components.'
type: Site
recipes:
  - sous-content-base
  - sous-paragraph-types
install:
  - layout_discovery
  - layout_builder
  - layout_paragraphs
  - layout_paragraphs_library
  - layout_paragraphs_permissions
  - layout_paragraphs_limit
  - paragraphs_features
  - paragraphs_type_permissions
config:
  import:
    paragraphs_ee: '*'
    paragraphs_features: '*'
  actions:
    core.entity_form_display.node.page.default:
      setComponent:
        name: field_content
        options:
          type: layout_paragraphs
          weight: 7
          region: content
          settings:
            view_mode: default
            preview_view_mode: default
            form_display_mode: default
            nesting_depth: 0
            require_layouts: 0
            empty_message: ''
            widget_settings_source: default
            widget_settings:
              show_search: true
              show_icons: true
              show_description: false
              display_mode: list
          third_party_settings: {}
      setProperties:
        third_party_settings.field_group.group_content.children:
          - field_content
    core.entity_view_display.node.page.default:
      setComponent:
        name: field_content
        options:
          type: layout_paragraphs
          label: hidden
          settings:
            view_mode: default
            link: ''
          third_party_settings: {}
          weight: 1
          region: content
    core.entity_form_display.node.frontpage.default:
      setComponent:
        name: field_content
        options:
          type: layout_paragraphs
          weight: 7
          region: content
          settings:
            view_mode: default
            preview_view_mode: default
            form_display_mode: default
            nesting_depth: 0
            require_layouts: 0
            empty_message: ''
            widget_settings_source: default
            widget_settings:
              show_search: true
              show_icons: true
              show_description: false
              display_mode: list
          third_party_settings: {}
      setProperties:
        third_party_settings.field_group.group_content.children:
          - field_content
    core.entity_view_display.node.frontpage.default:
      setComponent:
        name: field_content
        options:
          type: layout_paragraphs
          label: hidden
          settings:
            view_mode: default
            link: ''
          third_party_settings: {}
          weight: 1
          region: content
    '?user.role.site_editor':
      grantPermissions:
        - 'access component_library entity browser pages'
        - 'administer paragraphs library'
        - 'bypass paragraphs type content access'
        - 'duplicate layout paragraphs components'
        - 'edit layout paragraphs plugin config'
        - 'reorder layout paragraphs components'
    user.role.anonymous:
      grantPermissions:
        - 'view paragraph content layout'
        - 'view paragraph content text'
        - 'view paragraph content text_with_media'
        - 'view paragraph content video'
        - 'view paragraph content image'
        - 'view paragraph content accordion'
        - 'view paragraph content quote'
        - 'view paragraph content embed'
        - 'view paragraph content table'
        - 'view paragraph content tabs'
        - 'view paragraph content from_library'
        - 'view paragraph content accordion_item'
        - 'view paragraph content tabs_item'
    user.role.authenticated:
      grantPermissions:
        - 'view paragraph content layout'
        - 'view paragraph content text'
        - 'view paragraph content text_with_media'
        - 'view paragraph content video'
        - 'view paragraph content image'
        - 'view paragraph content accordion'
        - 'view paragraph content quote'
        - 'view paragraph content embed'
        - 'view paragraph content table'
        - 'view paragraph content tabs'
        - 'view paragraph content from_library'
        - 'view paragraph content accordion_item'
        - 'view paragraph content tabs_item'
    layout_paragraphs.settings:
      simpleConfigUpdate:
        show_paragraph_labels: 0
        show_layout_labels: 0
        show_layout_plugin_labels: 0
        paragraph_behaviors_label: Behaviors
        paragraph_behaviors_position: -99
        empty_message: 'No components to add.'
        button_labels:
          enable_tooltips: true
          default: 'Add Component'
          root: 'Add Component'
          layout: 'Add Component'
    layout_paragraphs.modal_settings:
      simpleConfigUpdate:
        width: 80%
        height: 80%
        autoresize: true
    layout_paragraphs.widget_settings:
      simpleConfigUpdate:
        show_search: true
        show_icons: true
        show_description: true
        display_mode: grid
    paragraphs_features.settings:
      simpleConfigUpdate:
        dropdown_to_button: false
