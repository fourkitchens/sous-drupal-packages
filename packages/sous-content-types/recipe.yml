name: 'Sous Content Types'
description: 'Provides Page and Frontpage content types with Body fields, teasers and URL aliases.'
type: Site
recipes:
  - sous-content-base
config:
  actions:
    core.entity_form_display.node.page.default:
      setComponent:
        name: body
        options:
          type: text_textarea_with_summary
          weight: 121
          region: content
          settings:
            rows: 9
            summary_rows: 3
            placeholder: ''
            show_summary: false
          third_party_settings: {}
      setProperties:
        third_party_settings.field_group.group_content.children:
          - body
    core.entity_view_display.node.page.default: &page_display
      setComponent:
        name: body
        options:
          type: text_default
          label: hidden
          settings: {}
          third_party_settings: {}
          weight: 0
          region: content
    core.entity_view_display.node.page.full: *page_display
    core.entity_form_display.node.frontpage.default:
      setComponent:
        name: body
        options:
          type: text_textarea_with_summary
          weight: 121
          region: content
          settings:
            rows: 9
            summary_rows: 3
            placeholder: ''
            show_summary: false
          third_party_settings: {}
      setProperties:
        third_party_settings.field_group.group_content.children:
          - body
    core.entity_view_display.node.frontpage.default: &frontpage_display
      setComponent:
        name: body
        options:
          type: text_default
          label: hidden
          settings: {}
          third_party_settings: {}
          weight: 0
          region: content
    core.entity_view_display.node.frontpage.full: *frontpage_display
