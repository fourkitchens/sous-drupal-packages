name: 'Sous Search'
description: 'Site search with a results page, content type filter and header search box.'
type: Site
install:
  - search_api
  - search_api_db
  - facets
  - facets_exposed_filters
  - views
config:
  strict: false
  actions:
    block.block.sous_search_form:
      placeBlockInDefaultTheme:
        plugin: 'views_exposed_filter_block:search-block_1'
        # Core uses the fallback region only when given a region map.
        region: {}
        default_region: header
        position: last
        settings:
          id: 'views_exposed_filter_block:search-block_1'
          label: 'Search'
          label_display: '0'
          provider: views
