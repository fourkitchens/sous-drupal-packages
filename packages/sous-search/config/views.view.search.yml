langcode: en
status: true
dependencies:
  config:
    - search_api.index.content
  module:
    - facets_exposed_filters
    - search_api
    - user
id: search
label: Search
module: views
description: 'Displays site search results.'
tag: ''
base_table: search_api_index_content
base_field: search_api_id
display:
  default:
    id: default
    display_title: Default
    display_plugin: default
    position: 0
    display_options:
      title: Search
      pager:
        type: full
        options:
          items_per_page: 10
      exposed_form:
        type: basic
        options:
          submit_button: Search
      access:
        type: perm
        options:
          perm: 'access content'
      cache:
        type: search_api_tag
        options: {}
      empty:
        area_text_custom:
          id: area_text_custom
          table: views
          field: area_text_custom
          relationship: none
          plugin_id: text_custom
          empty: true
          content: 'No results match your search.'
          tokenize: false
      sorts:
        search_api_relevance:
          id: search_api_relevance
          table: search_api_index_content
          field: search_api_relevance
          relationship: none
          plugin_id: search_api
          order: DESC
      filters:
        search_api_fulltext:
          id: search_api_fulltext
          table: search_api_index_content
          field: search_api_fulltext
          relationship: none
          plugin_id: search_api_fulltext
          operator: and
          value: ''
          exposed: true
          expose:
            label: Search
            identifier: keys
          parse_mode: terms
      style:
        type: default
      row:
        type: search_api
        options:
          view_modes:
            'entity:node':
              ':default': teaser
      query:
        type: search_api_query
        options: {}
      header:
        result:
          id: result
          table: views
          field: result
          relationship: none
          plugin_id: result
          empty: false
          content: 'Displaying @start–@end of @total results'
      display_extenders: {}
    cache_metadata:
      max-age: -1
      contexts:
        - 'languages:language_interface'
        - url
        - url.query_args
        - 'user.node_grants:view'
        - user.permissions
      tags:
        - 'config:search_api.index.content'
        - 'search_api_list:content'
  block_results:
    id: block_results
    display_title: 'Search results'
    display_plugin: block
    position: 1
    display_options:
      block_description: 'Search results'
      use_ajax: true
      filters:
        search_api_fulltext:
          id: search_api_fulltext
          table: search_api_index_content
          field: search_api_fulltext
          relationship: none
          plugin_id: search_api_fulltext
          operator: and
          value: ''
          exposed: true
          expose:
            label: Search
            identifier: keys
          parse_mode: terms
        facets_type:
          id: facets_type
          table: search_api_index_content
          field: facets_type
          relationship: none
          plugin_id: facets_filter
          operator: '='
          value: ''
          exposed: true
          expose:
            label: 'Content type'
            identifier: type
            multiple: false
          label_display: visible
          facet:
            query_operator: or
            min_count: 1
            processor_configs:
              list_item:
                processor_id: list_item
                weights:
                  build: 5
                settings: {}
      filter_groups:
        operator: AND
        groups:
          1: AND
      defaults:
        use_ajax: false
        filters: false
        filter_groups: false
      display_extenders: {}
    cache_metadata:
      max-age: -1
      contexts:
        - 'languages:language_interface'
        - url
        - url.query_args
        - 'user.node_grants:view'
        - user.permissions
      tags:
        - 'config:search_api.index.content'
        - 'search_api_list:content'
