name: 'Sous Alerts'
description: 'Site-wide alert banners with scheduling, dismissal and a top-of-page block.'
type: Site
install:
  - sitewide_alert
  - sitewide_alert_block
  - views
config:
  strict: false
  actions:
    '?dashboard.dashboard.editor':
      addComponentToLayout:
        section: 1
        position: 99
        component:
          # Constant so reapplying replaces this block instead of adding another.
          uuid: 593fc280-4e25-4884-bd75-95c9c5299a2a
          region:
            layout_twocol_section: second
          default_region: content
          configuration:
            id: 'views_block:dashboard_alerts-block_active'
            label: 'Site alerts'
            label_display: visible
            provider: views
            context_mapping: {}
            views_label: ''
            items_per_page: none
    sitewide_alert.settings:
      simpleConfigUpdate:
        display_order: descending
        automatic_refresh: false
    '?user.role.site_editor':
      grantPermissions:
        - 'add sitewide alert entities'
        - 'administer sitewide alert entities'
        - 'delete sitewide alert entities'
        - 'edit sitewide alert entities'
        - 'view unpublished sitewide alert entities'
    user.role.anonymous:
      grantPermissions:
        - 'view published sitewide alert entities'
    user.role.authenticated:
      grantPermissions:
        - 'view published sitewide alert entities'
    block.block.sous_sitewide_alert:
      placeBlockInDefaultTheme:
        plugin: sitewide_alert_block
        # Core uses the fallback region only when given a region map.
        region: {}
        default_region: content_top
        position: first
        settings:
          id: sitewide_alert_block
          label: 'Sitewide Alert'
          label_display: '0'
          provider: sitewide_alert_block
