name: 'Sous Paragraph Types'
description: 'Text, media and presentation fields with grouped Paragraph authoring forms.'
type: Site
recipes:
  - sous-formats
  - sous-media
install:
  - file
  - image
  - media
  - media_library
  - options
  - text
  - paragraphs
  - paragraphs_collapsible
  - paragraphs_ee
  - taxonomy
  - views
  - focal_point
  - media_library_edit
  - field_group
  - style_selector
  - paragraphs_library
config:
  strict:
    - core.entity_form_display.paragraph.image.default
    - core.entity_form_display.paragraph.text.default
    - core.entity_form_display.paragraph.text_with_media.default
    - core.entity_form_display.paragraph.video.default
    - core.entity_view_display.paragraph.image.default
    - core.entity_view_display.paragraph.text.default
    - core.entity_view_display.paragraph.text_with_media.default
    - core.entity_view_display.paragraph.video.default
    - field.field.paragraph.image.field_heading
    - field.field.paragraph.image.field_image
    - field.field.paragraph.image.field_show_captions
    - field.field.paragraph.image.field_style_layout_width
    - field.field.paragraph.image.field_text
    - field.field.paragraph.text.field_heading
    - field.field.paragraph.text.field_text
    - field.field.paragraph.text_with_media.field_component_focus
    - field.field.paragraph.text_with_media.field_heading
    - field.field.paragraph.text_with_media.field_media
    - field.field.paragraph.text_with_media.field_show_captions
    - field.field.paragraph.text_with_media.field_style_media_alignment
    - field.field.paragraph.text_with_media.field_text
    - field.field.paragraph.text_with_media.field_text_with_media_display
    - field.field.paragraph.video.field_heading
    - field.field.paragraph.video.field_show_captions
    - field.field.paragraph.video.field_style_layout_width
    - field.field.paragraph.video.field_text
    - field.field.paragraph.video.field_video
    - field.storage.paragraph.field_component_focus
    - field.storage.paragraph.field_heading
    - field.storage.paragraph.field_image
    - field.storage.paragraph.field_media
    - field.storage.paragraph.field_show_captions
    - field.storage.paragraph.field_style_layout_width
    - field.storage.paragraph.field_style_media_alignment
    - field.storage.paragraph.field_text
    - field.storage.paragraph.field_text_with_media_display
    - field.storage.paragraph.field_video
    - paragraphs.paragraphs_type.image
    - paragraphs.paragraphs_type.text
    - paragraphs.paragraphs_type.text_with_media
    - paragraphs.paragraphs_type.video
    - paragraphs_ee.paragraphs_category.media_components
    - paragraphs_ee.paragraphs_category.text_components
  import:
    paragraphs:
      - core.entity_view_mode.paragraph.preview
    style_selector: '*'
    paragraphs_library:
      - core.entity_form_display.paragraph.from_library.default
      - core.entity_view_display.paragraph.from_library.default
      - core.entity_view_display.paragraphs_library_item.paragraphs_library_item.summary
      - core.entity_view_mode.paragraphs_library_item.summary
      - field.field.paragraph.from_library.field_reusable_paragraph
      - field.storage.paragraph.field_reusable_paragraph
      - paragraphs.paragraphs_type.from_library
      - views.view.paragraphs_library
