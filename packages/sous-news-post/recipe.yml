name: 'Sous News Post'
description: 'Adds news posts with bylines, categories, teasers and a Recent News listing.'
type: Site
recipes:
  - sous-workflow
  - sous-media
install:
  - node
  - menu_ui
  - taxonomy
  - media
  - media_library
  - field_group
  - metatag
  - path
  - pathauto
  - tagify
  - views
config:
  import:
    metatag: '*'
    node:
      - core.entity_view_mode.node.teaser
  strict:
    - core.entity_form_display.node.news_post.default
    - core.entity_view_display.node.news_post.default
    - core.entity_view_display.node.news_post.teaser
    - field.field.node.news_post.field_byline
    - field.field.node.news_post.field_news_categories
    - field.field.node.news_post.field_metadata
    - field.field.node.news_post.field_teaser_image
    - field.field.node.news_post.field_teaser_text
    - field.storage.node.field_byline
    - field.storage.node.field_news_categories
    - field.storage.node.field_metadata
    - field.storage.node.field_teaser_image
    - field.storage.node.field_teaser_text
    - node.type.news_post
    - pathauto.pattern.news_post
    - taxonomy.vocabulary.news_categories
    - views.view.news
  actions:
    workflows.workflow.editorial:
      addNodeTypes:
        - news_post
