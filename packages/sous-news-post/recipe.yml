name: 'Sous News Post'
description: 'Adds news posts with bylines, categories, teasers and a Recent News listing.'
type: Site
recipes:
  - sous-workflow
  - sous-media
install:
  - node
  - menu_ui
  - taxonomy
  - media
  - media_library
  - entity_browser
  - field_group
  - metatag
  - path
  - pathauto
  - tagify
  - views
config:
  import:
    metatag: '*'
    node:
      - core.entity_view_mode.node.teaser
  strict:
    - core.entity_form_display.node.news_post.default
    - core.entity_view_display.node.news_post.admin_preview
    - core.entity_view_display.node.news_post.default
    - core.entity_view_display.node.news_post.full
    - core.entity_view_display.node.news_post.teaser
    - entity_browser.browser.news_content_browser
    - field.field.node.news_post.field_byline
    - field.field.node.news_post.field_news_categories
    - field.field.node.news_post.field_metadata
    - field.field.node.news_post.field_teaser_image
    - field.field.node.news_post.field_teaser_text
    - field.storage.node.field_byline
    - field.storage.node.field_news_categories
    - field.storage.node.field_metadata
    - field.storage.node.field_teaser_image
    - field.storage.node.field_teaser_text
    - node.type.news_post
    - pathauto.pattern.news_post
    - taxonomy.vocabulary.news_categories
    - views.view.news
  actions:
    '?user.role.site_editor':
      grantPermissions:
        - 'create url aliases'
        - 'access news_content_browser entity browser pages'
        - 'create terms in news_categories'
        - 'edit terms in news_categories'
        - 'delete terms in news_categories'
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'edit any %bundle content'
        - 'delete any %bundle content'
        - 'view %bundle revisions'
        - 'revert %bundle revisions'
        - 'delete %bundle revisions'
    workflows.workflow.editorial:
      addNodeTypes:
        - news_post
